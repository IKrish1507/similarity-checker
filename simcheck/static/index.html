<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simcheck</title>
<link rel="stylesheet" href="/static/app.css">
<script>
  // Apply the saved theme before the page paints, so it doesn't flash.
  try {
    const theme = JSON.parse(localStorage.getItem("simcheck.theme.v1"));
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch {}
</script>
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar" id="sidebar" aria-label="Checks">
    <div class="sidebar-top">
      <div class="brand"><span class="logo" data-icon="logo"></span><span>simcheck</span></div>
      <button class="icon-btn" id="collapse" title="Close sidebar" aria-label="Close sidebar"><span data-icon="sidebar"></span></button>
    </div>

    <button class="new-btn" id="new-check">
      <span data-icon="plus"></span><span>New check</span><kbd>Ctrl Shift O</kbd>
    </button>

    <label class="search">
      <span data-icon="search"></span>
      <input id="search" type="search" placeholder="Search checks" aria-label="Search checks" autocomplete="off">
    </label>

    <nav class="history" id="history" aria-label="Previous checks"></nav>

    <div class="sidebar-foot">
      <div class="popover" id="settings" hidden>
        <h3>Detection settings</h3>
        <label class="field">
          <span>Words per k-gram <b id="k-val"></b></span>
          <input type="range" id="k" min="2" max="15" step="1">
        </label>
        <label class="field">
          <span>Window size <b id="w-val"></b></span>
          <input type="range" id="w" min="1" max="15" step="1">
        </label>
        <p class="field-note" id="guarantee"></p>
        <div class="popover-row">
          <span class="engine-line" id="engine-line"></span>
          <button class="link-btn" id="reset-settings">Reset</button>
        </div>
      </div>
      <button class="foot-btn" id="settings-btn" aria-expanded="false" aria-controls="settings">
        <span data-icon="sliders"></span><span>Settings</span>
      </button>
      <div class="theme-switch" role="group" aria-label="Theme">
        <button data-theme-choice="system" title="Match system"><span data-icon="monitor"></span></button>
        <button data-theme-choice="light" title="Light"><span data-icon="sun"></span></button>
        <button data-theme-choice="dark" title="Dark"><span data-icon="moon"></span></button>
      </div>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn open-sidebar" id="open-sidebar" title="Open sidebar" aria-label="Open sidebar"><span data-icon="sidebar"></span></button>
      <button class="icon-btn open-sidebar" id="new-check-top" title="New check" aria-label="New check"><span data-icon="plus"></span></button>
      <h1 class="title" id="title">New check</h1>
      <span class="engine-badge" id="engine-badge" hidden></span>
      <button class="icon-btn" id="help" title="How it works" aria-label="How it works"><span data-icon="help"></span></button>
    </header>

    <div class="thread-scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer-dock" id="dock">
      <div class="composer-wrap" id="composer-wrap">
        <div class="composer" id="composer">
          <div class="chips" id="chips" hidden></div>
          <textarea id="input" rows="1" placeholder="Paste a document here, or attach .txt files…" aria-label="Document text"></textarea>
          <div class="composer-row">
            <label class="icon-btn" title="Attach .txt files" aria-label="Attach .txt files">
              <span data-icon="clip"></span>
              <input id="files" type="file" accept=".txt,.md,text/plain" multiple hidden>
            </label>
            <button class="pill-btn" id="add-text" hidden><span data-icon="plus"></span>Add as document</button>
            <span class="doc-count" id="doc-count"></span>
            <button class="send" id="send" title="Compare (Ctrl+Enter)" aria-label="Compare" disabled><span data-icon="arrowUp"></span></button>
          </div>
        </div>
        <p class="hint" id="hint"></p>
      </div>
    </div>
  </main>
</div>

<div class="drop-overlay" id="drop-overlay"><div><span data-icon="file"></span>Drop .txt files to add them</div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog id="dialog">
  <div class="dialog-head">
    <h2 id="dialog-title"></h2>
    <button class="icon-btn" id="dialog-close" aria-label="Close"><span data-icon="x"></span></button>
  </div>
  <div class="dialog-body" id="dialog-body"></div>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
